<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mildyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54"/>
      <stop offset="45%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#FFA84A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#150C12" stroke="#381320" stroke-width="2"/>
  
  <!-- Subtle glowing accent ring -->
  <rect x="14" y="14" width="92" height="92" rx="22" fill="none" stroke="url(#mildyGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Modern Stylized "M" with Studio / Waveform Play crest -->
  <path d="M32 82 V38 L48 64 L60 48 L72 64 L88 38 V82" 
        stroke="url(#mildyGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#glow)"/>
  
  <!-- Iris Star / Sparkle in upper right -->
  <path d="M78 26 L80 32 L86 34 L80 36 L78 42 L76 36 L70 34 L76 32 Z" fill="url(#irisGrad)"/>
  
  <!-- Bottom micro badge -->
  <circle cx="60" cy="85" r="3.5" fill="#FF2A54"/>
</svg>
